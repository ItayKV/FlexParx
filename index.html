<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexParx</title>
  <link rel="stylesheet" href="shared/base.css" />
  <link rel="stylesheet" href="components/toolbar/toolbar.css" />
  <link rel="stylesheet" href="components/flex-editor/flex-editor.css" />
  <link rel="stylesheet" href="components/step-nav/step-nav.css" />
  <link rel="stylesheet" href="components/step-instruction/step-instruction.css" />
  <link rel="stylesheet" href="components/road/road.css" />
  <link rel="stylesheet" href="components/level-actions/level-actions.css" />
</head>
<body>
  <!-- Component: Toolbar -->
  <header class="toolbar">
    <h1 class="toolbar__title">Flex Parx</h1>
  </header>

  <main class="main">
    <!-- Component: Flex Editor -->
    <section class="flex-editor">
      <div class="flex-editor__field">
        <span class="flex-editor__label">Container (road)</span>
        <div id="container-attrs"></div>
      </div>

      <div id="car-type-fields" class="flex-editor__car-fields"></div>
    </section>

    <section class="road-area">
      <!-- Component: Step Nav -->
      <div class="step-nav">
        <button id="step-nav-prev" class="step-nav__btn" type="button">
          <span class="step-nav__icon" aria-hidden="true">&#8592;</span>
          <span class="step-nav__text">Previous</span>
        </button>
        <span id="step-nav-label" class="step-nav__label">Loading Steps</span>
        <button id="step-nav-next" class="step-nav__btn" type="button">
          <span class="step-nav__text">Next</span>
          <span class="step-nav__icon" aria-hidden="true">&#8594;</span>
        </button>
      </div>

      <!-- Component: Step Instruction -->                                   
      <div class="step-instruction">                                         
        <span id="step-instruction-concept" class="step-instruction__concept"></span>   
        <p id="step-instruction-text" class="step-instruction__text"></p>    
      </div>                                                                 

      <!-- Component: Road -->
      <div class="road-frame">
        <div class="road">
          <div id="road-parking" class="road__layer road__layer--parking"></div>
          <div id="road-cars" class="road__layer road__layer--cars"></div>
        </div>
      </div>
      
      <!-- Component: Level Actions -->
      <div class="level-actions">
        <span id="level-actions-total" class="level-actions__total"></span>
        <button id="level-actions-reset" class="level-actions__btn level-actions__btn--reset" type="button">
          <span class="level-actions__icon" aria-hidden="true">&#8635;</span>
          <span class="level-actions__text">Reset</span>
        </button>
        <button id="level-actions-submit" class="level-actions__btn level-actions__btn--submit" type="button">
          <span class="level-actions__icon" aria-hidden="true">&#10003;</span>
          <span class="level-actions__text">Submit</span>
        </button>
      </div>

      <div id="feedback-popup" class="feedback-popup" hidden>
        <div id="feedback-popup-backdrop" class="feedback-popup__backdrop"></div>
        <div id="feedback-popup-dialog" class="feedback-popup__dialog" role="alertdialog" aria-modal="true">
          <p id="feedback-popup-message" class="feedback-popup__message"></p>
          <p id="feedback-popup-score" class="feedback-popup__score"></p>
          <button id="feedback-popup-close" class="feedback-popup__btn" type="button">OK</button>
        </div>
      </div>
    </section>
  </main>

  <script src="data/steps.js"></script>
  <script src="data/flex-attributes.js"></script>
  <script src="data/scores.js"></script>
  <script src="data/steps-provider.js"></script>
  <script src="components/road/road.js"></script>
  <script src="components/flex-editor/flex-editor.js"></script>
  <script src="components/step-nav/step-nav.js"></script>
  <script src="components/step-instruction/step-instruction.js"></script>
  <script src="components/level-actions/level-actions.js"></script>
</body>
</html>
